# cutver.toml - release orchestration configuration
# For full documentation, see https://github.com/Row0902/cutver

[[manifest]]
path = "package.json"
kind = "json"
field = "version"

[preflight]
build = { command = "pnpm run build", timeout = 120 }
default_timeout = 300

[changelog]
path = "CHANGELOG.md"
format = "keep-a-changelog"
mode = "conventional"

[git]
tag_prefix = "v"
require_clean_tree = true
commit_message = "chore(release): v{version} [skip ci]"
require_branch = "main"


[publish]
push = true
